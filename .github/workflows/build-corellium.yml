name: Build FlowCrypt for Corellium

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/build-corellium.yml
      - .github/scripts/sign_corellium.py

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Force GitHub SSH dependencies to HTTPS
        shell: bash
        run: |
          set -euo pipefail
          git config --global --unset-all 'url.https://github.com/.insteadOf' || true
          git config --global --add 'url.https://github.com/.insteadOf' 'git@github.com:'
          git config --global --add 'url.https://github.com/.insteadOf' 'ssh://git@github.com/'

          echo 'Configured GitHub URL rewrites:'
          git config --global --get-all 'url.https://github.com/.insteadOf'
          git ls-remote git@github.com:Marketcircle/libetpan HEAD

      - name: Show environment
        run: |
          sw_vers
          xcodebuild -version
          git rev-parse HEAD

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project FlowCrypt.xcodeproj \
            -scheme "FlowCrypt" \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackagePluginValidation \
            -skipMacroValidation

      - name: Archive unsigned device build
        run: |
          set -euo pipefail
          xcodebuild \
            -project FlowCrypt.xcodeproj \
            -scheme "FlowCrypt" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FlowCrypt.xcarchive" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

          test -d "$RUNNER_TEMP/FlowCrypt.xcarchive/Products/Applications/FlowCrypt.app"

      - name: Sign and verify Corellium app
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/FlowCrypt.xcarchive/Products/Applications/FlowCrypt.app"
          python3 .github/scripts/sign_corellium.py \
            "$APP" \
            6DZ6CC3YMY \
            "$GITHUB_WORKSPACE/corellium-signed-entitlements.plist"

      - name: Package and verify IPA
        shell: bash
        run: |
          set -euo pipefail

          APP="$RUNNER_TEMP/FlowCrypt.xcarchive/Products/Applications/FlowCrypt.app"
          PACKAGE="$RUNNER_TEMP/package"
          rm -rf "$PACKAGE"
          mkdir -p "$PACKAGE/Payload"
          ditto "$APP" "$PACKAGE/Payload/FlowCrypt.app"

          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          IPA="$GITHUB_WORKSPACE/FlowCrypt-Corellium-${SHORT_SHA}.ipa"

          cd "$PACKAGE"
          /usr/bin/zip -qry "$IPA" Payload
          cd "$GITHUB_WORKSPACE"

          unzip -t "$IPA"

          VERIFY_DIR="$RUNNER_TEMP/verify-ipa"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          unzip -q "$IPA" -d "$VERIFY_DIR"

          PACKAGED_APP="$VERIFY_DIR/Payload/FlowCrypt.app"
          test -d "$PACKAGED_APP"

          python3 .github/scripts/sign_corellium.py \
            "$PACKAGED_APP" \
            6DZ6CC3YMY \
            "$RUNNER_TEMP/packaged-app-entitlements.plist" \
            --verify-only

          BUNDLE_ID="$(python3 -c 'import plistlib,sys; print(plistlib.load(open(sys.argv[1],"rb"))["CFBundleIdentifier"])' "$PACKAGED_APP/Info.plist")"
          APP_ID="$(python3 -c 'import plistlib,sys; print(plistlib.load(open(sys.argv[1],"rb"))["application-identifier"])' "$RUNNER_TEMP/packaged-app-entitlements.plist")"

          {
            echo "Commit: $(git rev-parse HEAD)"
            echo
            xcodebuild -version
            echo
            echo "Bundle ID: $BUNDLE_ID"
            echo "application-identifier: $APP_ID"
            echo
            shasum -a 256 "$IPA"
          } > build-info.txt

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FlowCrypt-Corellium
          path: |
            FlowCrypt-Corellium-*.ipa
            build-info.txt
            corellium-signed-entitlements.plist
          if-no-files-found: error
          retention-days: 14
